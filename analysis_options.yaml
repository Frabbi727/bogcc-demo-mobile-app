# Static analysis for the BOGCC demo app.
#
# Two rules here are load-bearing rather than stylistic:
#   - `avoid_print`  : nothing in this app should write to stdout in release.
#   - `always_declare_return_types` and the immutability lints keep the ported
#     domain layer honest, since it mirrors a TypeScript codebase where every
#     record type is readonly.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # A missed await in the seed/persistence layer is a real bug, not a hint.
    unawaited_futures: error
    # Generated code is committed; a stale part file must fail the build.
    uri_has_not_been_generated: error
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
