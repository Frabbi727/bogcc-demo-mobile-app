name: bogcc_demo_mobile_app
description: "বগুড়া সিটি কর্পোরেশন — ডেমো মোবাইল অ্যাপ (নাগরিক ও অফিস)"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.44.6 ships Dart 3.12.2, which is what pins the codegen stack below.
  # freezed 4.x needs Dart >=3.13.0, so freezed stays on 3.x; freezed 3.x in turn
  # caps `analyzer` below 11, which caps build_runner below 2.15.2. Raising any
  # one of those three requires raising the SDK first. `flutter pub upgrade
  # --major-versions` will break this resolution.
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State: the store is one record set with many derived read-models, which
  # Riverpod's provider graph expresses directly.
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  # Persistence: per-record writes, pure Dart, no NDK.
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  # Its maxWidth/maxHeight/imageQuality replicate the web's image.ts (800px, q0.7).
  image_picker: ^1.2.3
  # Only for MaterialLocalizations under bn_BD; all formatting goes through core/bn.
  intl: ^0.20.2 # pinned to 0.20.2 by flutter_localizations
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  uuid: ^4.6.0

dev_dependencies:
  # 2.15.2+ needs analyzer >=13.3, which freezed 3.x cannot satisfy.
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5 # NOT ^4 — requires Dart >=3.13.0
  json_serializable: ^6.8.0
  # Needed to fake path_provider in a test; both are transitive at runtime, but
  # a test that implements the platform interface must depend on them directly.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/demo/photos/

  # Bundled, not downloaded: google_fonts would force the INTERNET permission
  # this app deliberately does without. Both families are SIL OFL 1.1, so
  # bundling is licence-clean provided OFL.txt ships (it does, above, and the
  # about screen surfaces it).
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
          weight: 400
        - asset: assets/fonts/TiroBangla-Italic.ttf
          weight: 400
          style: italic
